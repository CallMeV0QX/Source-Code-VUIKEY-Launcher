[package]
name = "update-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

